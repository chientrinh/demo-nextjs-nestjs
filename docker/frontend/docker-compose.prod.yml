services:
  frontend:
    build:
      context: ../..
      dockerfile: docker/frontend/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
    networks:
      - bistro

networks:
  bistro:
    external: true
