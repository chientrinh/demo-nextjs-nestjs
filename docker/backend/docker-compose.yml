services:
  backend:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
      target: dev
    container_name: demo-backend
    ports:
      - "3001:3001"
    volumes:
      - ../../backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://demo:demo@database:5432/demo?schema=public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://frontend:3000}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:-}
    networks:
      - demo

networks:
  demo:
    external: true
