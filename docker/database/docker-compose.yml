services:
  database:
    image: postgres:16-alpine
    container_name: bistro-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bistro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy docker/database/.env.example to docker/database/.env and set it}
      POSTGRES_DB: ${POSTGRES_DB:-bistro}
    ports:
      # Chỉ bind localhost: không phơi DB ra mọi interface (xem docs/operations/security-audit.md, H1).
      - "127.0.0.1:5432:5432"
    volumes:
      - bistro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bistro} -d ${POSTGRES_DB:-bistro}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bistro

volumes:
  bistro_pgdata:

networks:
  bistro:
    external: true
